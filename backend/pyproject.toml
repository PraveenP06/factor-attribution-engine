[project]
name = "factor-attribution-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "statsmodels>=0.14",
    "yfinance>=0.2",
    "pandas-datareader>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "plotly>=5.20",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = ["network: marks tests that hit external APIs (deselect with -m 'not network')"]

[tool.coverage.run]
omit = ["tests/*", "api/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
